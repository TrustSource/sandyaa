name: "Finn: Ingest Issue"

on:
  issues:
    types: [labeled]

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: ubuntu-latest
    steps:
      - name: Pre-flight checks
        env:
          FINN_KEY: ${{ secrets.FINN_API_KEY }}
        run: |
          FAIL=0

          # Assignee check
          ASSIGNEES='${{ toJSON(github.event.issue.assignees.*.login) }}'
          if ! echo "$ASSIGNEES" | grep -q "flnDEV-eacg"; then
            echo "::error::flnDEV-eacg is not assigned to this issue. Assign first, then re-add the agent-task label."
            FAIL=1
          fi

          # Secret check
          if [ -z "$FINN_KEY" ]; then
            echo "::error::FINN_API_KEY secret is not set or not visible to this repository. Check org secret visibility."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Pre-flight failed. Fix the above issues, then remove and re-add the agent-task label."
            exit 1
          fi
          echo "✅ Pre-flight passed"

      - name: Determine priority
        id: priority
        run: |
          LABELS='${{ toJSON(github.event.issue.labels.*.name) }}'
          if echo "$LABELS" | grep -q "prio-high"; then
            echo "priority=prio-high" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "prio-low"; then
            echo "priority=prio-low" >> $GITHUB_OUTPUT
          else
            echo "priority=prio-normal" >> $GITHUB_OUTPUT
          fi

      - name: Determine increment
        id: increment
        run: |
          LABELS='${{ toJSON(github.event.issue.labels.*.name) }}'
          INC=$(echo "$LABELS" | grep -oE '"inc-[0-9]+"' | head -1 | tr -d '"')
          echo "increment=${INC:-}" >> $GITHUB_OUTPUT

      - name: Determine model
        id: model
        run: |
          LABELS='${{ toJSON(github.event.issue.labels.*.name) }}'
          if echo "$LABELS" | grep -q "model-opus"; then
            echo "model=claude-opus-4-7" >> $GITHUB_OUTPUT
          else
            echo "model=claude-sonnet-4-6" >> $GITHUB_OUTPUT
          fi

      - name: Check no-docs flag
        id: nodocs
        run: |
          LABELS='${{ toJSON(github.event.issue.labels.*.name) }}'
          if echo "$LABELS" | grep -q "no-docs"; then
            echo "no_docs=true" >> $GITHUB_OUTPUT
          else
            echo "no_docs=false" >> $GITHUB_OUTPUT
          fi

      - name: Call Ingest API
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "https://dev-team.eacg.de/ingest" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.FINN_API_KEY }}" \
            -d '{
              "repo": "${{ github.repository }}",
              "issue_number": ${{ github.event.issue.number }},
              "issue_url": "${{ github.event.issue.html_url }}",
              "title": ${{ toJSON(github.event.issue.title) }},
              "priority": "${{ steps.priority.outputs.priority }}",
              "increment": "${{ steps.increment.outputs.increment }}",
              "model": "${{ steps.model.outputs.model }}",
              "no_docs": ${{ steps.nodocs.outputs.no_docs }}
            }')

          BODY=$(cat /tmp/response.txt)
          echo "Backend responded HTTP $HTTP_CODE: $BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Ingest API returned HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
          echo "✅ Ingest successful"
